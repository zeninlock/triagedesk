# Production GitHub-authenticated deployment. Paid resources; review docs/HOSTING.md.
services:
  - type: pserv
    name: triagedesk-api
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/start-api.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: triagedesk-db, property: connectionString}
      - key: ARTIFACT_DIR
        value: /var/data/artifacts
      - key: MODE
        value: real
      - key: AUTH_MODE
        value: github
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_TOKEN_LOGIN
        value: "true"
      - key: READ_ONLY
        value: "false"
      - key: SESSION_HOURS
        value: "8"
      - key: PORT
        value: "8000"
    disk:
      name: artifacts
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: triagedesk-ui
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/start-ui.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_HOST
        fromService: {name: triagedesk-api, type: pserv, property: host}
      - key: API_PORT
        value: "8000"
databases:
  - name: triagedesk-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: triagedesk
    user: triagedesk
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
