[project]
name = "triagedesk"
version = "1.0.0"
description = "OpenAI issue triage hosted on Streamlit Community Cloud with Neon PostgreSQL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1", "uvicorn>=0.35,<1", "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1", "openai>=2,<3", "streamlit>=1.66,<2", "pandas>=2.3,<3",
  "cryptography>=46,<48"
]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.13,<1", "jsonschema>=4.25,<5"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/triagedesk"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
