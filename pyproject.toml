[project]
name = "triagedesk"
version = "0.1.0"
description = "Human-reviewed GitHub issue triage with honest ML evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1", "uvicorn>=0.35,<1", "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1", "scikit-learn>=1.7,<2", "numpy>=2.2,<3",
  "joblib>=1.5,<2", "streamlit>=1.50,<2", "pandas>=2.3,<3", "pyyaml>=6,<7",
  "cryptography>=46,<48"
]
[project.optional-dependencies]
semantic = ["sentence-transformers>=5.1,<6", "torch>=2.8,<3"]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.13,<1", "jsonschema>=4.25,<5"]
[project.scripts]
triagedesk = "triagedesk.cli:main"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/triagedesk"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
