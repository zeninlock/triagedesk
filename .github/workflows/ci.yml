name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: triagedesk
          POSTGRES_PASSWORD: triagedesk
          POSTGRES_DB: triagedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triagedesk -d triagedesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://triagedesk:triagedesk@localhost:5432/triagedesk_test
      TEST_DATABASE_URL: postgresql+psycopg://triagedesk:triagedesk@localhost:5432/triagedesk_test
      MODE: fixture
      READ_ONLY: "false"
      REVIEWER_TOKEN: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src ui tests
      - run: uv run ruff format --check src ui tests alembic
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
